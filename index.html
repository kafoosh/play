<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ODDPAQ: Winds of Wonder</title>
  <script>
    // Backup URL force: "/7D" or "?=7D" arms the 7 of Diamonds. Anything may follow the card.
    // The address is reset to the bare site before first paint. This works for "/7D" because the
    // deploy also publishes this page as 404.html. Values A 2-10 J Q K, suits C H S D, any case.
    (function () {
      var card = /^(10|[2-9]|[ajqk])([chsd])/i, base = location.pathname, m = null;
      var segs = location.pathname.split('/');
      for (var i = 1; i < segs.length && !m; i++) {
        var seg = segs[i];
        try { seg = decodeURIComponent(seg); } catch (e) {}
        if (card.test(seg)) { m = card.exec(seg); base = segs.slice(0, i).join('/') + '/'; }
      }
      var q = location.search.replace(/^\?=?/, '');
      if (!m && location.search) {
        // "?=" is a card only if it is exactly a card ("7D", "qs") or starts with a digit
        // ("7D90"). Letters only means a QWERTY+1 ciphered word ("?=jraap" = HELLO).
        if (/^(10|[2-9]|[ajqk])[chsd]$/i.test(q) || (/^\d/.test(q) && card.test(q))) m = card.exec(q);
        else if (/^([a-z+_-]|%20)+$/i.test(q)) {
          window.__forceWord = q;
          try { history.replaceState(null, '', location.pathname); } catch (e) {}
          return;
        }
      }
      if (!m) return;
      var v = m[1].toUpperCase();
      window.__force = { v: v === 'A' ? 1 : v === 'J' ? 11 : v === 'Q' ? 12 : v === 'K' ? 13 : parseInt(v, 10), s: m[2].toUpperCase() };
      // Load the game's files from the real site folder, not from under "/7D/...".
      var b = document.createElement('base'); b.href = base; document.head.appendChild(b);
      try { history.replaceState(null, '', base); } catch (e) {}
    })();
  </script>
  <meta name="description" content="A tiny fantasy adventure. Find the wizard.">
  <meta name="theme-color" content="#15122a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winds of Wonder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="src/art.js">
  <link rel="modulepreload" href="src/data.js">
  <link rel="modulepreload" href="src/audio.js">
</head>
<body>
  <main id="app">
    <div id="screenWrap"><canvas id="screen" width="160" height="144" aria-label="ODDPAQ: Winds of Wonder"></canvas></div>
    <div id="dpad" role="group" aria-label="Direction pad">
      <span class="bar h"></span><span class="bar v"></span>
      <span class="ar up"></span><span class="ar down"></span><span class="ar left"></span><span class="ar right"></span>
    </div>
    <button id="btnA" type="button" aria-label="A button">A</button>
    <button id="mute" type="button" aria-label="Sound on or off">&#9835;</button>
    <p id="keys">ARROWS / WASD TO WALK &nbsp; Z / SPACE = A</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
